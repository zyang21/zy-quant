# Conservative Institutional & ETF-Anchored Watchlist Scoring Configuration
# Total weights = 1.00, with 65% anchored on conservative ETF / Institutional / Stability pillars.

hard_filters:
  min_price_usd: 50.0                  # Avoid low-priced stocks where Futu per-share ($0.0129/sh) fees explode
  min_avg_daily_dollar_vol: 500000000  # >= $500M daily dollar volume -> ultra-tight 1-2 cent spreads
  min_institutional_pct: 0.55          # >= 55% institutional ownership required (anti-junk / anti-meme)
  earnings_blackout_days: 2            # Block entries within +-2 trading days of earnings release
  max_spread_bps: 8.0                  # Block live entry if real-time bid-ask spread > 8 bps

weights:
  etf_core_weight: 0.30                # Weight in core index/sector ETFs (SPY, QQQ, XLK, SMH, XLV, XLF)
  institutional_ownership: 0.20        # SEC 13F aggregate institutional ownership stability score
  low_drawdown_stability: 0.15         # Low beta + Red-Day Relative Strength (RS vs QQQ when market rests)
  realtime_big_order_flow: 0.20        # Futu get_capital_distribution() Super-Large + Large net inflow ratio
  insider_form4_catalyst: 0.15         # SEC EDGAR Form 4 C-suite open-market cash buys (last 14 days)

scoring_thresholds:
  min_watch_score: 62.0                # Minimum composite score (0-100) to enter active candidate pool
  top_n_active: 8                      # Only subscribe 15m real-time bars/flow on top N candidates (saves Futu quota)
  red_day_rs_bonus_cap: 15.0           # Extra bonus within stability bucket for stocks green while QQQ is red

# Pre-vetted liquid US Institutional / ETF Core Universe (all typically >$50 & >$500M ADV)
