# 4-Step Strategy, Graduated Regime Governance, and Scientific Swing Exit Formulas

# Step 1: Graduated Market Regime Traffic Light (SPY / QQQ + Realized Vol)
regime:
  primary_benchmark: "QQQ"
  secondary_benchmark: "SPY"
  volatility_symbol: "^VIX"
  daily_sma_period: 20
  vix_yellow_threshold: 28.0            # Caution regime -> Selective Alpha Leaders only (65% size)
  vix_red_threshold: 38.0               # Extreme panic regime -> Lock all new buys
  sharp_intraday_drop_pct: -0.012       # QQQ intraday drop <= -1.2% -> RED light
  yellow_position_scale: 0.65           # Position scale for independent RS leaders during YELLOW regime
  green_scan_interval_minutes: 15       # GREEN: Active trading & watchlist scan every 15 minutes
  yellow_watchlist_interval_minutes: 45 # YELLOW: Watchlist refresh every 45m
  rest_watchlist_interval_minutes: 120  # RED: Watchlist RS refresh every 2 hours

# Step 3: 15-Minute Institutional Entry Setups
entry:
  bar_timeframe: "15m"
  atr_period: 14
  ema_fast_period: 9
  ema_trend_period: 21
  entry_start_hour_et: 10               # Avoid 09:30-10:00 opening whipsaw
  entry_end_hour_et: 14                 # Block late-day (>14:30 ET) entries into overnight gap risk
  entry_end_minute_et: 30
  require_stock_above_sma20: true       # Only buy stocks in their own daily uptrend (Close >= 20d SMA)
  yellow_min_rs_outperformance: 0.015   # In YELLOW regime, stock must beat QQQ by >= +1.5% over 20 days
  cooldown_hours_after_exit: 20         # Per-symbol cooldown to prevent same-day revenge churn

  vwap_pullback:
    enabled: true
    min_morning_rvol: 1.5
    max_pullback_rvol: 1.05
    vwap_touch_band_atr: 0.35

  opening_range_breakout:
    enabled: true
    orb_minutes: 30
    min_breakout_rvol: 1.8
    require_positive_big_order_flow: true

# Step 4: Multi-Day Swing Exit & Expectancy Math
exit_models:
  # 1. Wilder ATR Initial Stop with noise-band floor: S_init = P_entry - max(2.8*ATR_14, 1.5%*P)
  atr_stop_multiplier: 2.8
  min_stop_pct: 0.015                   # Never place a hair-trigger <1.5% stop inside intraday noise
  max_hard_stop_pct: 0.040              # Absolute safety cap (<= 4.0% price distance)

  # 2. Breakeven Ratchet + Wide Swing Chandelier Exit: S_trail(t) = H_max - 4.2 * ATR_14(t)
  breakeven_trigger_r: 1.8              # Lift stop above round-trip fees at +1.8R
  chandelier_atr_multiplier: 4.2        # Wide multi-day Chandelier lets trend winners run across sessions

  # 3. Multi-Session Time Barrier
  time_stop_bars_15m: 52                # ~2 trading sessions (52 x 15m bars) before cutting dead money
  time_stop_min_progress_r: 0.15

  # 4. Positive Mathematical Expectancy Gate
  assumed_base_win_rate: 0.48
  expected_reward_atr_multiple: 6.5
  min_expectancy_r: 0.25

# Operational Daemon & Safety Watchdogs
daemon:
  heartbeat_timeout_seconds: 30
  max_orders_per_minute: 3
  place_server_side_stop: true
