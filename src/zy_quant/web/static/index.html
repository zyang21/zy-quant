<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zy-quant · Quantitative Trading Terminal</title>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
</head>
<body>
  <!-- Sticky Frosted Navigation Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="brand-mark">ZY</span>
        <span>zy-quant</span>
      </div>
      <nav class="nav-tabs" aria-label="Primary">
        <button class="nav-tab active" data-route="overview">Dashboard</button>
        <button class="nav-tab" data-route="history">Trade History</button>
        <button class="nav-tab" data-route="backtest">Strategy Backtest</button>
      </nav>
    </div>

    <div class="topbar-right">
      <span id="hdrConnBadge"></span>
      <span id="hdrMarketBadge"></span>
      <button class="btn" id="hdrScanBtn">Refresh Scan</button>
      <button class="btn btn-danger" id="hdrHaltBtn">Kill-Switch</button>
    </div>
  </header>

  <!-- Market Benchmark Ticker Ribbon -->
  <div class="ticker-ribbon">
    <div class="ribbon-group">
      <div class="ribbon-kv">
        <span class="k">Market Traffic Light</span>
        <span class="v" id="ribTraffic">—</span>
      </div>
      <div class="ribbon-kv">
        <span class="k">Nasdaq 100 (QQQ)</span>
        <span class="v" id="ribQqq">—</span>
      </div>
      <div class="ribbon-kv">
        <span class="k">QQQ Intraday VWAP</span>
        <span class="v" id="ribVwap">—</span>
      </div>
      <div class="ribbon-kv">
        <span class="k">S&amp;P 500 (SPY)</span>
        <span class="v" id="ribSpy">—</span>
      </div>
      <div class="ribbon-kv">
        <span class="k">Volatility Index</span>
        <span class="v" id="ribVix">—</span>
      </div>
    </div>
    <div class="ribbon-kv" style="text-align:right;">
      <span class="k">Market Data Source</span>
      <span class="v txt-muted" id="ribFeed">—</span>
    </div>
  </div>

  <!-- Main Multi-View Workspace -->
  <main class="workspace">
    <!-- Data Integrity / Fallback Warning Banner -->
    <div id="fallbackAlertBanner" style="display:none;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;margin-bottom:12px;border-radius:10px;background:rgba(246,70,93,0.14);border:1px solid rgba(246,70,93,0.45);color:#ff8093;font-size:12.5px;font-weight:600;">
      <span id="fallbackAlertText"></span>
      <span style="font-family:var(--font-mono);font-size:11.5px;">NON-PRIMARY FEED</span>
    </div>

    <div class="session-banner" id="sessionBanner">
      <span id="sessionBannerText"></span>
      <span id="sessionBannerTime" style="font-family:var(--font-mono);opacity:0.8;"></span>
    </div>

    <div id="view-overview"></div>
    <div id="view-history" style="display:none;"></div>
    <div id="view-backtest" style="display:none;"></div>
  </main>

  <!-- Docked Expandable Backend Log Console -->
  <aside class="log-dock" id="logDock" aria-label="Backend Logs"></aside>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
